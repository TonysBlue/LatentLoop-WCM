[project]
name = "latentloop-data"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "latentloop-model",
  "latentloop-runtime",
  "latentloop-media",
  "harness",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
  "webdataset==1.0.2",
]

[project.scripts]
data = "data.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]
